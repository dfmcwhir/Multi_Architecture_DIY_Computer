# ld65 config: program loaded and run at $0500.
# ZP: $E0-$FF is used for the demo's variables. Move it if your monitor or
# BIOS uses that range.
MEMORY {
    ZP:  start = $E0,   size = $20,   type = rw, file = "";
    RAM: start = $0500, size = $3B00, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw;
    BSS:      load = RAM, type = bss, define = yes;
}
