; ESP32-S3 VGA / keyboard / mouse / sound adapter for a W65C02S computer.
;
; Needs Arduino-ESP32 3.x (ESP-IDF 5.x). The stock PlatformIO "espressif32"
; platform still ships Arduino 2.x, so this uses the community pioarduino
; platform. Tested build: Arduino-ESP32 3.3.x / ESP-IDF 5.5.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 module (16 MB flash, 8 MB octal PSRAM): uncomment these two lines.
; PSRAM is not used by the firmware, so the defaults also work.
;board_build.arduino.memory_type = qio_opi
;board_upload.flash_size = 16MB

; Serial = UART0 (the board's "UART" USB port). The native USB port is the
; USB host for the keyboard/mouse, so upload through the UART port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed = 921600
