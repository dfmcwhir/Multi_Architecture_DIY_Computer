# ld65 config: the engine is linked to run at $0500 (where the monitor loads it).
# Level data is loaded at $5000 and the frame buffers sit above it, so the
# program and its variables must end below $5000.
MEMORY {
    RAM: start = $0500, size = $4B00, file = %O;    # $0500-$4FFF
}
SEGMENTS {
    CODE:   load = RAM, type = rw;
    RODATA: load = RAM, type = ro;
    DATA:   load = RAM, type = rw;
    BSS:    load = RAM, type = bss;                 # variables, not in the file
}
