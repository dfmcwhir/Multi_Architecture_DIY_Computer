# ld65 config: the program is linked to run at $0500 (where the monitor loads it)
MEMORY {
    RAM: start = $0500, size = $7A00, file = %O;    # $0500-$7EFF
}
SEGMENTS {
    CODE:   load = RAM, type = rw;
    RODATA: load = RAM, type = ro;
    BSS:    load = RAM, type = bss;                 # not in the file
}
