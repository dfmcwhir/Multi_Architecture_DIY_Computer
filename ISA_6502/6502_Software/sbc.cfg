# ld65 linker configuration for main.s  (EhBASIC + BIOS + wozmon + CH376)
#
# Memory map assumed (edit to match your decoding):
#   $0000-$00FF  zero page          $0100-$01FF  stack
#   $0200-$027F  wozmon line buffer (IN, fixed in wozmon.s)
#   $0280-$02DF  CH376 variables    (CHVARS)
#   $0300-$0368  EhBASIC page-3 variables + input buffer (fixed in basic.s)
#   $0380-$038F  BIOS variables     (BIOSVARS)
#   $0400-$04FF  serial/keyboard receive buffer (INPUT_BUFFER)
#   $0500-$7EFF  BASIC program/variable RAM (Ram_base/Ram_top in basic.s)
#   $7F00-$7FFF  I/O
#   $8000-$FDFF  ROM: EhBASIC (CODE) then BIOS + CH376 (BIOS)
#   $FE00-$FEFF  ROM: fixed jump table for your own programs (jumptable.s)
#   $FF00-$FFF9  ROM: wozmon (WOZ_ENTRY = $FF00)
#   $FFFA-$FFFF  ROM: vectors
MEMORY {
    ZP:       file = "", start = $00E2, size = $000D, type = rw;   # free ZP bytes in EhBASIC
    CHVARS:   file = "", start = $0280, size = $0080, type = rw;
    BIOSVARS: file = "", start = $0380, size = $0080, type = rw;
    SERBUF:   file = "", start = $0400, size = $0100, type = rw;
    ROM:      file = %O, start = $8000, size = $7E00, type = ro, fill = yes, fillval = $FF;
    JTAB:     file = %O, start = $FE00, size = $0100, type = ro, fill = yes, fillval = $FF;
    WOZ:      file = %O, start = $FF00, size = $00FA, type = ro, fill = yes, fillval = $FF;
    VECS:     file = %O, start = $FFFA, size = $0006, type = ro, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE:     load = ZP,       type = zp;
    CHVARS:       load = CHVARS,   type = bss;
    BIOSVARS:     load = BIOSVARS, type = bss;
    INPUT_BUFFER: load = SERBUF,   type = bss;
    CODE:         load = ROM,      type = ro;
    BIOS:         load = ROM,      type = ro;
    JUMPTAB:      load = JTAB,     type = ro;
    WOZMON:       load = WOZ,      type = ro;
    RESETVEC:     load = VECS,     type = ro;
}
