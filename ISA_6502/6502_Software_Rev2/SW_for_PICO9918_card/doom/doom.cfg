# ld65 config: the engine is linked to run at $0800 (CPU Rev2: $0500-$07FF is the ROM's).
# Level data is loaded at $5800 and the frame buffers sit above it, so the
# program and its variables must end below $5800.
MEMORY {
    RAM: start = $0800, size = $5000, file = %O;    # $0800-$57FF
}
SEGMENTS {
    CODE:   load = RAM, type = rw;
    RODATA: load = RAM, type = ro;
    DATA:   load = RAM, type = rw;
    BSS:    load = RAM, type = bss;                 # variables, not in the file
}
