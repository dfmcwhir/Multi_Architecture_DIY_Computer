# ld65 config: DOOM2 runs at $0800 (CPU Rev2: $0500-$07FF is the ROM's).
# The level is loaded at $7900, so the program and its variables must end
# below it.
MEMORY {
    RAM: start = $0800, size = $7100, file = %O;    # $0800-$78FF
}
SEGMENTS {
    CODE:   load = RAM, type = rw;
    RODATA: load = RAM, type = ro;
    DATA:   load = RAM, type = rw;
    BSS:    load = RAM, type = bss;                 # variables, not in the file
}
