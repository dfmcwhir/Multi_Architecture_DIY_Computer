# ld65 config for GUI.BIN: install.s at $0800 (filled to $0B00), then the
# file manager, linked to run at $1000 (install.s copies it into the top bank)
MEMORY {
    INST: start = $0800, size = $0300, file = %O, fill = yes, fillval = $00;
    SH:   start = $1000, size = $6F00, file = %O;
}
SEGMENTS {
    INSTALL: load = INST, type = rw;
    CODE:    load = SH,   type = rw;
    RODATA:  load = SH,   type = rw;
    BSS:     load = SH,   type = bss;
}
