# ld65 config: the program is linked to run at $0800 (where the monitor loads it)
MEMORY {
    RAM: start = $0800, size = $7700, file = %O;    # $0800-$7EFF
}
SEGMENTS {
    CODE:   load = RAM, type = rw;
    RODATA: load = RAM, type = ro;
    BSS:    load = RAM, type = bss;                 # variables, not in the file
    MAZE:   load = RAM, type = bss, align = $100;   # the maze being played
}
