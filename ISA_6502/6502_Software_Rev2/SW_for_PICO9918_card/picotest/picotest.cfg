# ld65 config: the program is linked to run at $0800 (where the monitor
# loads it on a CPU Rev2 ROM: $0500-$07FF holds the ROM's driver variables)
MEMORY {
    RAM: start = $0800, size = $7700, file = %O;    # $0800-$7EFF
}
SEGMENTS {
    CODE:   load = RAM, type = rw;
    RODATA: load = RAM, type = ro;
    BSS:    load = RAM, type = bss;                 # not in the file
}
