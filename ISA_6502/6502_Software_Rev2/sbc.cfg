# ld65 linker configuration for the CPU Rev2 ROM (main.s)
#
# RAM ($0000-$0FFF is never banked; ALL BIOS RAM is in there):
#   $0000-$00FF  zero page          $0100-$01FF  stack
#   $0200-$027F  wozmon line buffer (IN, fixed in wozmon.s)
#   $0280-$02FF  CH376 variables    (CHVARS)
#   $0300-$0368  EhBASIC page-3 variables + input buffer (fixed in basic.s)
#   $0380-$03FF  BIOS variables     (BIOSVARS)
#   $0400-$04FF  console input buffer (INPUT_BUFFER)
#   $0500-$07FF  driver variables   (DRVVARS)          <- new for Rev2
#   $0800-$7EFF  BASIC / loaded programs (USER_RAM in config.inc)
#                ($1000-$7EFF is the banked window)
#   $7F00-$7FFF  I/O  ($7FFE bank register, $7FFF interrupt register)
# ROM:
#   $8000-$FDFF  EhBASIC (CODE) then BIOS + drivers (BIOS)
#   $FE00-$FEFE  fixed jump table (jumptable.s);  $FEFF display type byte
#   $FF00-$FFF9  wozmon (WOZ_ENTRY = $FF00)
#   $FFFA-$FFFF  vectors
MEMORY {
    ZP:       file = "", start = $00E2, size = $000D, type = rw;   # free ZP bytes in EhBASIC
    CHVARS:   file = "", start = $0280, size = $0080, type = rw;
    BIOSVARS: file = "", start = $0380, size = $0080, type = rw;
    SERBUF:   file = "", start = $0400, size = $0100, type = rw;
    DRVRAM:   file = "", start = $0500, size = $0300, type = rw;
    ROM:      file = %O, start = $8000, size = $7E00, type = ro, fill = yes, fillval = $FF;
    JTAB:     file = %O, start = $FE00, size = $00FF, type = ro, fill = yes, fillval = $FF;
    SYSB:     file = %O, start = $FEFF, size = $0001, type = ro, fill = yes, fillval = $FF;
    WOZ:      file = %O, start = $FF00, size = $00FA, type = ro, fill = yes, fillval = $FF;
    VECS:     file = %O, start = $FFFA, size = $0006, type = ro, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE:     load = ZP,       type = zp;
    CHVARS:       load = CHVARS,   type = bss;
    BIOSVARS:     load = BIOSVARS, type = bss;
    INPUT_BUFFER: load = SERBUF,   type = bss;
    DRVVARS:      load = DRVRAM,   type = bss;
    CODE:         load = ROM,      type = ro;
    BIOS:         load = ROM,      type = ro;
    JUMPTAB:      load = JTAB,     type = ro;
    SYSBYTE:      load = SYSB,     type = ro;
    WOZMON:       load = WOZ,      type = ro;
    RESETVEC:     load = VECS,     type = ro;
}
